<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stock" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Shopping Stock</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #0f1222; }
      #boot { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; gap: 1rem; padding: 1rem; text-align: center; }
      #boot .spinner { width: 32px; height: 32px; border: 3px solid #e2e5ec; border-top-color: #1f6feb; border-radius: 50%; animation: s .8s linear infinite; }
      #boot .msg { color: #5b6478; font-size: .9rem; }
      #boot .err { color: #d1242f; font-size: .9rem; max-width: 420px; word-break: break-word; }
      @keyframes s { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3; }
        #boot .spinner { border-color: #30363d; border-top-color: #1f6feb; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div class="spinner" aria-hidden="true"></div>
        <div class="msg">Loading Shopping Stock…</div>
        <div class="err" id="boot-err" hidden></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-err');
        if (el && e && e.message) { el.hidden = false; el.textContent = 'Startup error: ' + e.message; }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('boot-err');
        if (el) { el.hidden = false; el.textContent = 'Startup error: ' + (e.reason && (e.reason.message || e.reason) || 'unknown'); }
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
